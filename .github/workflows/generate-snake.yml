# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Generate the snake files in './dist/'
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0E75B6&color_dots=#E8F4FA,#B9DDF0,#7FC1E0,#4A9CC4,#0E75B6
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00BFFF&color_dots=#0D1B2A,#123B4D,#176B87,#2296B5,#00BFFF
            dist/github-contribution-grid-snake.gif?color_snake=#0E75B6&color_dots=#E8F4FA,#B9DDF0,#7FC1E0,#4A9CC4,#0E75B6

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build status
        run: git status

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
