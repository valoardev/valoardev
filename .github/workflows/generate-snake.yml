# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Generate the snake files in './dist/'
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230E75B6&color_dots=%23E8F4FA,%23B9DDF0,%237FC1E0,%234A9CC4,%230E75B6
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300BFFF&color_dots=%230D1B2A,%23123B4D,%23176B87,%232296B5,%2300BFFF
            dist/github-contribution-grid-snake.gif?color_snake=%230E75B6&color_dots=%23E8F4FA,%23B9DDF0,%237FC1E0,%234A9CC4,%230E75B6

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build status
        run: git status

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
